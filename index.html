<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    // On phones, lock the zoom to a fixed scale. The app is designed at a fixed
    // width, so pinch-zoom and iOS's focus-zoom (which fires when you tap an
    // input with <16px text) both make the layout jump. maximum-scale=1 +
    // user-scalable=no pins it. Runs inline (before the app bundle) so it
    // applies even if the app's JS is still loading. Desktop/tablet keep the
    // default zoomable meta.
    (function () {
      try {
        var mm = window.matchMedia;
        var coarse = !!(mm && mm('(pointer: coarse)').matches);
        var touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
        var uaMobile = /Android|iPhone|iPad|iPod|Mobile|Silk|Windows Phone/i.test(navigator.userAgent || '');
        var phone = Math.min(window.innerWidth || 0, window.innerHeight || 0) < 820;
        if (phone && (coarse || uaMobile || touch)) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#0a0e11" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HS PT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>HS PT App</title>
  <!-- Brand hex clip-path defs (used by .hex class) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="hs-hex-clip" clipPathUnits="objectBoundingBox">
        <path transform="scale(0.0025707, 0.0027399)" d="M194.489,30.721c-3.782,0 -7.574,0.799 -10.995,2.417l-141.142,66.762c-6.877,3.253 -11.356,9.426 -11.356,16.346l0,133.524c0,6.921 4.479,13.093 11.356,16.346l141.142,66.762c6.776,3.205 15.227,3.205 22.002,0l141.136,-66.762c6.876,-3.253 11.362,-9.424 11.362,-16.346l0,-133.524c0,-6.922 -4.486,-13.093 -11.362,-16.346l-141.136,-66.762c-3.418,-1.617 -7.23,-2.417 -11.007,-2.417Z"/>
      </clipPath>
    </defs>
  </svg>
  <script>
    // How tall the app column actually is.
    //
    // 100dvh looked like the answer and wasn't. On an installed iPhone it comes
    // back short of the screen, leaving a strip of the page showing under the
    // app - and opening the keyboard makes it worse, because dvh follows the
    // shrinking viewport down and doesn't reliably come back up afterwards.
    // That is why the strip started appearing mid-workout the moment a weight
    // was tapped.
    //
    // The height is measured instead, and only ever allowed to grow. A keyboard
    // opening shrinks the viewport; ignoring every shrink means the app keeps
    // its full height throughout and there is nothing to restore. A real change
    // in available height - rotating the phone - resets the measurement.
    //
    // Inline and ahead of the bundle on purpose: it owes nothing to the app, so
    // the column is the right height on the first paint and stays right even if
    // the app fails to start.
    (function () {
      try {
        var root = document.documentElement;
        var known = 0;
        function measure(reset) {
          if (reset) known = 0;
          var h = window.innerHeight;
          if (h > known) { known = h; root.style.setProperty('--app-vh', h + 'px'); }
        }
        measure(true);
        window.addEventListener('resize', function () { measure(false); });
        window.addEventListener('orientationchange', function () { setTimeout(function () { measure(true); }, 120); });
        // Returning from the background can be when iOS finally reports the
        // real height, so take another reading then.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') measure(false);
        });

        // Belt and braces for the same thing the CSS now prevents. If anything
        // still manages to scroll the page - a stray anchor, an iOS build that
        // scrolls a focused field into view regardless - put it back, because a
        // scrolled page is a column sitting above the bottom of the screen with
        // the page showing underneath.
        function unscroll() { if (window.scrollY !== 0) window.scrollTo(0, 0); }
        window.addEventListener('resize', unscroll);
        window.addEventListener('orientationchange', function () { setTimeout(unscroll, 150); });
        // focusout is the keyboard going away, which is when it happened.
        document.addEventListener('focusout', function () { setTimeout(unscroll, 50); });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') unscroll();
        });
        if (window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
          root.setAttribute('data-standalone', '');
        }
      } catch (e) { /* the CSS fallback covers a browser without any of this */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
